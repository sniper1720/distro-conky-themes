-- Distro Conky Themes: Octopus (Native X11 + Wayland)

local function get_config_path()
    local str = debug.getinfo(1).source:sub(2)
    return str:match("(.*[/\\])") or ""
end

local config_path = get_config_path()
local settings = dofile(config_path .. "settings.lua")

local use_wayland = (os.getenv("XDG_SESSION_TYPE") or "x11") == "wayland"

conky.config = {
    out_to_x = not use_wayland,
    out_to_wayland = use_wayland,

    background = false,
    update_interval = 2,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    override_utf8_locale = true,
    double_buffer = true,
    no_buffers = true,
    text_buffer_size = 2048,

    own_window = true,
    own_window_colour = '#0000',
    -- own_window_type controls the Wayland layer-shell layer:
    --   'desktop'  → BACKGROUND layer, visible on KDE (persists through
    --                 Show Desktop), but behind wallpaper on wlroots.
    --   'normal' + 'below' → BOTTOM layer, above wallpaper, below windows
    --                 on wlroots (Sway, Hyprland); hides on X11 Show Desktop.
    -- The installer sets the correct type per compositor.
    own_window_type = 'normal',
    -- KWin classifies the window from this (Wayland only). Directly on X11
    -- this is unused, so it is safe to leave set.
    own_window_namespace = 'normal',
    own_window_hints = 'undecorated,sticky,skip_taskbar,skip_pager,below',

    border_inner_margin = 0,
    border_outer_margin = 0,
    -- The installer sizes this window to the usable screen so the drawing
    -- adapts to any resolution; no scale factor is needed.
    minimum_width = settings.width,
    minimum_height = settings.height,

    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,

    use_xft = true,
    font = 'Roboto:size=12',
    xftalpha = 0.8,
    uppercase = false,
    default_color = 'FFFFFF',

    lua_load = config_path .. 'main.lua',
    lua_draw_hook_pre = 'conky_main',
    lua_startup_hook = 'conky_setup',

    alignment = 'middle_middle',
    gap_x = 0,
    gap_y = 0,
}

conky.text = ""
