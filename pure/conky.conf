-- Distro Conky Themes: Pure (Native X11 + Wayland)

-- Configuration
-- All dimensions are in logical points. Scaling is handled natively: on X11
-- conky multiplies text geometry and the minimum/maximum window bounds by
-- Xft.dpi / 96 (and point-sized Xft fonts scale with the display DPI); on
-- Wayland conky works in logical points and the compositor scales the surface
-- (wl_output.scale, wp_fractional_scale_v1). A manual scale knob would
-- double-scale on X11 and is redundant on Wayland, so there is none.
local network_interface = "wlan0"

-- Brand Colors (fallback defaults; the installer injects your distro's palette)
local solus_blue = "5294E2"
local solus_light = "CCCCCC"
local solus_muted = "8899AA"

local use_wayland = (os.getenv("XDG_SESSION_TYPE") or "x11") == "wayland"

-- Dynamic Dimensions (logical points)
local width = 320
local bar_width = 320
local font_title = 19
local font_section = 11
local font_value = 10
local font_small = 9
local section_gap = 10
local bar_height = 4

conky.config = {
    out_to_x = not use_wayland,
    out_to_wayland = use_wayland,

    background = false,
    update_interval = 1.5,
    cpu_avg_samples = 4,
    net_avg_samples = 2,
    diskio_avg_samples = 3,
    double_buffer = true,
    no_buffers = true,
    text_buffer_size = 16384,

    own_window = true,
    own_window_colour = '#0000',
    -- own_window_type controls the Wayland layer-shell layer:
    --   'desktop'  → BACKGROUND layer, visible on KDE (persists through
    --                 Show Desktop), but behind wallpaper on wlroots.
    --   'normal' + 'below' → BOTTOM layer, above wallpaper, below windows
    --                 on wlroots (Sway, Hyprland); hides on X11 Show Desktop.
    -- The installer sets the correct type per compositor.
    own_window_type = 'normal',
    -- KWin classifies the window from this (Wayland only). Directly on X11
    -- this is unused, so it is safe to leave set.
    own_window_namespace = 'normal',
    own_window_hints = 'undecorated,sticky,skip_taskbar,skip_pager,below',

    alignment = 'middle_right',
    gap_x = 25,
    gap_y = 0,
    minimum_width = width,
    maximum_width = width,

    border_inner_margin = 18,
    border_outer_margin = 0,
    draw_borders = false,
    draw_shades = false,
    draw_outline = false,
    draw_graph_borders = false,

    default_color = 'FFFFFF',
    color1 = solus_blue,
    color2 = solus_light,
    color3 = solus_muted,

    use_xft = true,
    font = 'Roboto:size=' .. font_value,
}

conky.text = [[
${alignc}${font Roboto:weight=300:size=]] .. font_title .. [[}${color1}LINUX${color}${font}
${alignc}${font Roboto:size=]] .. font_small .. [[}${color3}${nodename} • ${kernel}${color}${font}
${voffset ]] .. section_gap .. [[}
${font Roboto:bold:size=]] .. font_section .. [[}${color1}●${color} CPU${font}${alignr}${color1}${cpu cpu0}%${color} @ ${freq_g}GHz
${voffset 2}${font Roboto:size=]] .. font_small .. [[}${color2}Core 1: ${cpu cpu1}%  Core 2: ${cpu cpu2}%  Core 3: ${cpu cpu3}%  Core 4: ${cpu cpu4}%${color}${font}
${voffset 1}${font Roboto:size=]] .. font_small .. [[}${color2}Core 5: ${cpu cpu5}%  Core 6: ${cpu cpu6}%  Core 7: ${cpu cpu7}%  Core 8: ${cpu cpu8}%${color}${font}
${voffset 2}${color1}${cpubar cpu0 ]] .. bar_height .. [[,]] .. bar_width .. [[}${color}
${voffset 2}${font Roboto:size=]] .. font_small .. [[}${color3}Load: ${loadavg 1} ${loadavg 2}${alignr}Procs: ${running_processes}/${processes}${color}${font}
${voffset 2}${font Roboto:size=]] .. font_small .. [[}${color2}Top:${color}${font}
${font Roboto:size=]] .. font_small .. [[}${color3}  ${top name 1}${alignr}${top cpu 1}%  ${top mem 1}%
  ${top name 2}${alignr}${top cpu 2}%  ${top mem 2}%
  ${top name 3}${alignr}${top cpu 3}%  ${top mem 3}%${color}${font}
${voffset ]] .. section_gap .. [[}
${font Roboto:bold:size=]] .. font_section .. [[}${color1}●${color} MEMORY${font}${alignr}${color1}${memperc}%${color}
${voffset 2}${font Roboto:size=]] .. font_small .. [[}${color2}Used: ${mem}${alignr}Free: ${memfree}${color}${font}
${voffset 1}${font Roboto:size=]] .. font_small .. [[}${color3}Buffers: ${buffers}${alignr}Cached: ${cached}${color}${font}
${voffset 2}${color1}${membar ]] .. bar_height .. [[,]] .. bar_width .. [[}${color}
${voffset 4}${font Roboto:size=]] .. font_small .. [[}${color2}Top:${color}${font}
${font Roboto:size=]] .. font_small .. [[}${color3}  ${top_mem name 1}${alignr}${top_mem mem_res 1}
  ${top_mem name 2}${alignr}${top_mem mem_res 2}
  ${top_mem name 3}${alignr}${top_mem mem_res 3}${color}${font}
${voffset ]] .. section_gap .. [[}
${font Roboto:bold:size=]] .. font_section .. [[}${color1}●${color} SWAP${font}${alignr}${color1}${swapperc}%${color} ${swap}/${swapmax}
${voffset 2}${color3}${swapbar ]] .. bar_height .. [[,]] .. bar_width .. [[}${color}
${voffset ]] .. section_gap .. [[}
${font Roboto:bold:size=]] .. font_section .. [[}${color1}●${color} STORAGE${font}
${voffset 2}${font Roboto:size=]] .. font_small .. [[}${color2}/${color}${alignr}${fs_used /} / ${fs_size /} (${fs_used_perc /}%)${font}
${voffset 2}${color1}${fs_bar ]] .. bar_height .. [[,]] .. bar_width .. [[ /}${color}
${voffset 2}${font Roboto:size=]] .. font_small .. [[}${color2}/home${color}${alignr}${fs_used /home} / ${fs_size /home} (${fs_used_perc /home}%)${font}
${voffset 2}${color3}${fs_bar ]] .. bar_height .. [[,]] .. bar_width .. [[ /home}${color}
${voffset 2}${font Roboto:size=]] .. font_small .. [[}${color3}Read: ${diskio_read}${alignr}Write: ${diskio_write}${color}${font}
${voffset ]] .. section_gap .. [[}
${font Roboto:bold:size=]] .. font_section .. [[}${color1}●${color} NETWORK${font}${alignr}${font Roboto:size=]] .. font_small .. [[}${color3}]] .. network_interface .. [[${color}${font}
${voffset 2}${font Roboto:size=]] .. font_small .. [[}${color2}Local: ${addr ]] .. network_interface .. [[}${color}${font}
${voffset 1}${font Roboto:size=]] .. font_small .. [[}${color3}Public: ${execi 300 curl -s ifconfig.me 2>/dev/null || echo "N/A"}${color}${font}
${voffset 2}${font Roboto:size=]] .. font_small .. [[}${color3}↑ ${upspeed ]] .. network_interface .. [[}${alignr}↓ ${downspeed ]] .. network_interface .. [[}${color}${font}
${voffset ]] .. section_gap .. [[}
${font Roboto:bold:size=]] .. font_section .. [[}${color1}●${color} SYSTEM${font}
${voffset 2}${font Roboto:size=]] .. font_small .. [[}${color3}Uptime:${color} ${color2}${uptime}${color}
${color3}Threads: ${color2}${running_threads}${color}${alignr}${color3}Entropy: ${color2}${entropy_avail}/${entropy_poolsize}${color}${font}
${voffset ]] .. section_gap .. [[}
${alignc}${font Roboto:size=]] .. font_small .. [[}${color3}${time %A, %B %d} • ${time %H:%M:%S}${color}${font}
]]
